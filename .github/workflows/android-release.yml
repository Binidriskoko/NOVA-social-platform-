name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged release
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Require the pinned release signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "Missing repository secret: ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || { echo "Missing repository secret: ANDROID_KEYSTORE_PASSWORD" >&2; exit 1; }
          [ -n "$ANDROID_KEY_ALIAS" ] || { echo "Missing repository secret: ANDROID_KEY_ALIAS" >&2; exit 1; }
          [ -n "$ANDROID_KEY_PASSWORD" ] || { echo "Missing repository secret: ANDROID_KEY_PASSWORD" >&2; exit 1; }
          keystore="$RUNNER_TEMP/novakoko-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          certificate="$(keytool -exportcert -rfc -keystore "$keystore" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" \
            | openssl x509 -noout -fingerprint -sha256)"
          fingerprint="$(printf '%s' "$certificate" | sed 's/.*=//' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected='C81B2766C700A37A096C7A26F4F92DA73480F55F6221D1C660AC90F4508007DE'
          if [ "$fingerprint" != "$expected" ]; then
            echo "Configured signing certificate does not match the pinned release certificate; refusing to publish." >&2
            exit 1
          fi
          {
            echo "ANDROID_KEYSTORE_PATH=$keystore"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build, sign, and validate APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run android:release

      - name: Publish APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./public/release-metadata.json').versionName")"
          gh release create "$GITHUB_REF_NAME" \
            "release-artifacts/NOVAKOKO-v${version}.apk" \
            "release-artifacts/NOVAKOKO-v${version}.apk.sha256" \
            --verify-tag \
            --title "NOVAKOKO ${GITHUB_REF_NAME}" \
            --notes "$(
              node -e "const m = require('./public/release-metadata.json'); process.stdout.write(m.releaseNotes)"
            )

            The signed APK and SHA-256 checksum are attached. Android requires user approval to install downloaded APK updates."
