apply plugin: 'com.android.application'

def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseSigningEnvironment = [
    ANDROID_KEYSTORE_PATH: releaseKeystorePath,
    ANDROID_KEYSTORE_PASSWORD: System.getenv('ANDROID_KEYSTORE_PASSWORD'),
    ANDROID_KEY_ALIAS: System.getenv('ANDROID_KEY_ALIAS'),
    ANDROID_KEY_PASSWORD: System.getenv('ANDROID_KEY_PASSWORD'),
]
def expectedReleaseCertificateFingerprint = 'C81B2766C700A37A096C7A26F4F92DA73480F55F6221D1C660AC90F4508007DE'

android {
    namespace "com.novakoko.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.novakoko.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseKeystorePath) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.configureEach { task ->
    if (task.name in ['assembleRelease', 'bundleRelease']) {
        task.doFirst {
            def missingSigningValues = releaseSigningEnvironment.findAll { name, value -> !value }.keySet()
            if (!missingSigningValues.isEmpty()) {
                throw new GradleException("Refusing an unsigned Android release. Missing: ${missingSigningValues.join(', ')}")
            }
            if (!file(releaseKeystorePath).isFile()) {
                throw new GradleException('ANDROID_KEYSTORE_PATH must point to the existing release keystore.')
            }
            def certificateOutput = new ByteArrayOutputStream()
            exec {
                commandLine 'keytool', '-list', '-v', '-keystore', releaseKeystorePath,
                    '-storepass:env', 'ANDROID_KEYSTORE_PASSWORD', '-alias', System.getenv('ANDROID_KEY_ALIAS')
                standardOutput = certificateOutput
            }
            def fingerprintMatcher = certificateOutput.toString('UTF-8') =~ /(?m)^SHA256:\s*([0-9A-Fa-f:]+)\s*$/
            if (!fingerprintMatcher.find()
                || fingerprintMatcher.group(1).replace(':', '').toUpperCase() != expectedReleaseCertificateFingerprint) {
                throw new GradleException('Signing certificate does not match the pinned release certificate.')
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
