<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#06034a">
    <title>novachat brand</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; color: #f8fafc; background: #06034a; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; padding: 24px; place-items: center; }
      main { width: min(100%, 520px); text-align: center; }
      img { display: block; width: min(100%, 420px); height: auto; margin: 0 auto 20px; }
      h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="../novachat-logo.png" alt="The official novachat logo">
      <h1>novachat</h1>
    </main>
  </body>
</html>
